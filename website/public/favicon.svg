<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#serverGradient)" stroke="#1E1B4B" stroke-width="2"/>
  
  <!-- Server rack -->
  <rect x="8" y="6" width="16" height="20" rx="2" fill="#1F2937" stroke="#374151" stroke-width="0.5"/>
  
  <!-- Server units -->
  <rect x="9" y="8" width="14" height="3" rx="1" fill="#6B7280"/>
  <rect x="9" y="12" width="14" height="3" rx="1" fill="#6B7280"/>
  <rect x="9" y="16" width="14" height="3" rx="1" fill="#6B7280"/>
  <rect x="9" y="20" width="14" height="3" rx="1" fill="#6B7280"/>
  
  <!-- LED lights -->
  <circle cx="11" cy="9.5" r="0.8" fill="#10B981"/>
  <circle cx="13" cy="9.5" r="0.8" fill="#EF4444"/>
  <circle cx="11" cy="13.5" r="0.8" fill="#10B981"/>
  <circle cx="13" cy="13.5" r="0.8" fill="#10B981"/>
  <circle cx="11" cy="17.5" r="0.8" fill="#10B981"/>
  <circle cx="13" cy="17.5" r="0.8" fill="#F59E0B"/>
  <circle cx="11" cy="21.5" r="0.8" fill="#10B981"/>
  <circle cx="13" cy="21.5" r="0.8" fill="#10B981"/>
  
  <!-- Network ports -->
  <rect x="18" y="8.5" width="3" height="1.5" rx="0.3" fill="#374151"/>
  <rect x="18" y="12.5" width="3" height="1.5" rx="0.3" fill="#374151"/>
  <rect x="18" y="16.5" width="3" height="1.5" rx="0.3" fill="#374151"/>
  <rect x="18" y="20.5" width="3" height="1.5" rx="0.3" fill="#374151"/>
